<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koma · 生产版本进度</title>
<style>
:root{color-scheme:light;--ink:#172c36;--muted:#62767f;--line:#dce4e7;--green:#17684f;--amber:#956114;--blue:#246588;--paper:#f4f7f8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1180px;margin:auto;padding:32px 28px 60px}header,footer,.row{display:flex;justify-content:space-between;gap:16px;align-items:center}header{margin-bottom:26px;font-size:12px;color:var(--muted)}.brand{letter-spacing:.1em;font-weight:650}.dot{display:inline-block;width:7px;height:7px;background:var(--green);border-radius:50%;margin-right:7px}h1{font-size:34px;letter-spacing:-.04em;line-height:1.2;margin:10px 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0}p{margin:6px 0}.muted{color:var(--muted)}.small{font-size:12px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;margin:20px 0}.active{border-left:4px solid var(--blue)}.badge{display:inline-block;padding:3px 9px;border-radius:5px;background:#e4eff7;color:var(--blue);font-size:12px;font-weight:600;white-space:nowrap}.accepted{background:#e5f2ed;color:var(--green)}.open{background:#fff0d7;color:var(--amber)}.pending{background:#e7edf0;color:var(--muted)}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.grid .panel{margin:0}.proofs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.proof{border:1px solid var(--line);border-radius:8px;padding:15px;font-size:13px}.proof strong{display:block;margin-bottom:7px}.item{padding:17px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0;padding-top:0}.item p{font-size:13px}.timing{background:var(--paper);padding:9px 12px;border-radius:6px;font-size:12px;margin-top:10px;color:var(--muted)}.next{padding-top:12px;margin-top:13px;border-top:1px solid var(--line)}#stale{display:none;background:#fff0d7;color:var(--amber);padding:12px;border-radius:7px;margin-top:14px}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}.evidence{display:flex;flex-wrap:wrap;gap:10px}.evidence a{border:1px solid var(--line);padding:7px 11px;border-radius:6px;font-size:13px}code{font:12px ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}details{margin-top:12px;font-size:12px;color:var(--muted)}summary{cursor:pointer}ul{padding-left:20px}.milestone{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}.milestone time{display:block;color:var(--muted);font-size:11px}footer{margin-top:24px;font-size:12px;color:var(--muted);flex-wrap:wrap}@media(max-width:850px){main{padding:24px 16px}.grid{grid-template-columns:1fr}.proofs{grid-template-columns:1fr 1fr}h1{font-size:28px}.panel{padding:18px}.row{align-items:flex-start}.row h3{max-width:75%}}@media(max-width:480px){.proofs{grid-template-columns:1fr}header{align-items:flex-start}#connection{text-align:right;max-width:170px}}
</style>
<main>
<header><span class="brand">KOMA / 工作进度</span><span id="connection"><span class="dot"></span>正在读取本地工作单…</span></header>
<div id="content"><section class="panel">正在加载进度记录。</section></div>
<footer><span>每 3 秒读取当前工作单 · 页面连接正常不代表任务正在执行</span><a href="/work-order" target="_blank" rel="noopener">完整工作单 ↗</a></footer>
</main>
<script>
const content=document.querySelector('#content'),connection=document.querySelector('#connection');
let data=null,lastKey='',lastSuccess=null,inFlight=false;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};
const date=s=>s?new Date(s).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}):'未记录';
const duration=seconds=>{let s=Math.max(0,Math.floor(seconds)),days=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);return (days?days+'天 ':'')+(h?h+'小时 ':'')+m+'分 '+s%60+'秒'};
const badge=(text,kind)=>el('span',text,'badge '+(kind||'open'));
function panel(title){const n=el('section',null,'panel');n.append(el('h2',title));return n}
function render(d){
 const f=document.createDocumentFragment(),hero=el('section');hero.append(badge('首个生产版本 · '+d.state),el('h1',d.title),el('p',d.outcome,'muted'),el('p','实质更新：'+date(d.updatedAt)+' · '+d.target,'small muted'));const stale=el('p',null);stale.id='stale';hero.append(stale);f.append(hero);
 const active=panel('当前在做什么');active.classList.add('active');active.append(el('h3',d.activity.title),el('p',d.activity.detail,'muted'),el('p','当前事项：'+d.activeId+' · 本次动作开始：'+date(d.activity.startedAt),'small muted'),el('p','下一项未完成动作：'+d.nextAction,'next'));f.append(active);
 const proofPanel=panel('当前候选：证据到哪一层'),proofs=el('div',null,'proofs');for(const p of d.proof){const n=el('div',null,'proof');n.append(el('strong',p.label),badge(p.state,p.kind),el('p',p.detail));proofs.append(n)}proofPanel.append(proofs);const details=el('details');details.append(el('summary','查看当前版本与工作范围'),el('p','Koma 工作树：'+d.hosts[0].checkout),el('code','App 基底 '+d.hosts[0].appHead),el('p','最近安装 HAP：'),el('code',d.hosts[0].hap),el('p','当前 Kit：'+(d.liveKitHeads?.Koma||'读取失败')),el('p',d.scope));proofPanel.append(details);f.append(proofPanel);
 const grid=el('div',null,'grid'),queue=panel('有限队列：已获得的能力与剩余边界');queue.append(el('p','按实际能力记录；不以测试数量或提交数量计算完成比例。','small muted'));
 for(const g of d.items){const n=el('article',null,'item'),row=el('div',null,'row');row.append(el('h3',g.id+' · '+g.title),badge(g.status,g.kind));n.append(row,el('p',g.result),el('p','尚未覆盖：'+g.remaining,'muted'));const t=el('div',null,'timing');t.append(el('div','提出时间：'+(g.reportedAt?date(g.reportedAt):'原始时间未核实')),el('div',g.reportedAtSource),el('div','最早可核实记录：'+date(g.firstEvidenceAt)));const elapsed=el('div');elapsed.dataset.elapsed=g.id;t.append(elapsed);if(g.handling){const effort=el('div');effort.dataset.effort=g.id;t.append(effort)}else t.append(el('div','实际处理工时：此前未分段记录'));n.append(t);queue.append(n)}grid.append(queue);
 const side=el('div'),source=panel('阅读源：独立并行轨');source.append(badge(d.source.status,d.source.kind),el('h3',d.source.title),el('p',d.source.result),el('p','尚未覆盖：'+d.source.remaining,'small muted'),el('code','源提交 '+d.source.commit));side.append(source);const milestones=panel('本轮关键检查点');for(const m of d.milestones){const n=el('div',null,'milestone');n.append(el('time',date(m.at)),el('span',m.text));milestones.append(n)}side.append(milestones);const release=panel('到生产发布还差什么');const list=el('ul');for(const s of d.releaseGates)list.append(el('li',s));release.append(list,el('p',d.stopRule,'small muted'));side.append(release);grid.append(side);f.append(grid);
 const evidence=panel('可查看的原生证据'),links=el('div',null,'evidence');for(const e of d.evidence){const a=el('a',e.label);a.href='/evidence?id='+encodeURIComponent(e.id);a.target='_blank';a.rel='noopener';links.append(a)}evidence.append(links,el('p',d.evidenceNote,'small muted'));f.append(evidence);const limits=panel('投入与范围');limits.append(el('p',d.excluded),el('p','经过时间与实际工时分开。原始提出时间无法核实的项显示最早存证；不会把等待、构建或整段会话时长伪装成处理工时。','small muted'));f.append(limits);content.replaceChildren(f);tick();
}
function tick(){if(!data)return;const age=Math.max(0,Math.floor((Date.now()-Date.parse(data.updatedAt))/60000)),stale=document.querySelector('#stale');if(stale){stale.style.display=age>=15?'block':'none';stale.textContent='已 '+age+' 分钟没有实质进度更新。以上是最后一次记录，不能据此认定工作仍在执行。'}for(const g of data.items){const n=document.querySelector('[data-elapsed="'+g.id+'"]'),start=g.reportedAt||g.firstEvidenceAt,end=g.closedAt||new Date().toISOString();if(n)n.textContent=(g.reportedAt?'提出后经过：':'最早记录后经过：')+(start?duration((Date.parse(end)-Date.parse(start))/1000):'未核实')+(g.closedAt?' · 此命名路径已收口':' · 仍开放');if(g.handling){const n=document.querySelector('[data-effort="'+g.id+'"]'),h=g.handling,until=h.activeUntil?Date.parse(h.activeUntil):0,active=h.activeSince?Math.max(0,(Math.min(Date.now(),until)-Date.parse(h.activeSince))/1000):0;if(n)n.textContent='本次记录处理：'+duration(h.recordedSeconds+active)+(h.activeSince?(Date.now()>until?' · 记录已到期，等待更新':' · 此前工时未知'):' · 分段记录已结束，早期工时未知')}}}
async function refresh(){if(inFlight)return;inFlight=true;try{const r=await fetch('/api/progress',{cache:'no-store',signal:AbortSignal.timeout(6000)});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(d.schemaVersion!==1||!Array.isArray(d.items))throw Error('工作单格式不完整');lastSuccess=Date.now();const key=JSON.stringify({...d,servedAt:null});data=d;if(key!==lastKey){render(d);lastKey=key}connection.replaceChildren(el('span',null,'dot'),el('span','已连接 · '+date(new Date(lastSuccess).toISOString())))}catch(e){connection.textContent='读取失败 · '+e.message+(lastSuccess?' · 保留上次记录':'');}finally{inFlight=false}}
refresh();setInterval(refresh,3000);setInterval(tick,1000);
</script>
</html>
