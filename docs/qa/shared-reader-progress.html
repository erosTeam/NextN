<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>共享阅读器 · 工作进度</title>
<style>
:root{color-scheme:light;--ink:#172c36;--muted:#62767f;--line:#dce4e7;--green:#17684f;--amber:#956114;--red:#ae3d36;--blue:#246588;--paper:#f4f7f8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:1180px;margin:auto;padding:34px 28px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:28px}.brand{font-size:13px;letter-spacing:.1em;font-weight:650;color:var(--muted)}.connect{font-size:12px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px}h1{font-size:32px;letter-spacing:-.04em;line-height:1.25;margin:8px 0 14px}h2{font-size:18px;margin:0 0 15px}h3{font-size:15px;margin:0 0 7px}p{margin:5px 0}.muted{color:var(--muted)}.badge{display:inline-block;border-radius:5px;padding:3px 9px;font-size:12px;font-weight:650;background:#e7edf0;color:var(--muted)}.open{background:#fff0d7;color:var(--amber)}.accepted{background:#e5f2ed;color:var(--green)}.review{background:#e4eff7;color:var(--blue)}.bad{background:#fdeae7;color:var(--red)}.hero{margin-bottom:25px}.summary{max-width:850px;color:var(--muted);font-size:16px}.timestamp{margin-top:15px;font-size:12px;color:var(--muted)}.notice{margin-top:12px;padding:10px 14px;background:#fff0d7;color:var(--amber);border-radius:7px;display:none}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:23px;margin-bottom:20px}.activity{border-left:4px solid var(--blue)}.activity-title{font-size:20px;font-weight:650}.meta{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}.next{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}.hosts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.host{border:1px solid var(--line);border-radius:8px;padding:17px}.host-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.host-title h3{font-size:18px;margin:0}.proof{display:grid;grid-template-columns:62px 1fr;gap:8px 12px;font-size:13px}.label{color:var(--muted)}.runtime{margin-top:14px;padding-top:13px;border-top:1px solid var(--line);font-size:13px}.small{font-size:12px}code{font:12px ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}.host details{margin-top:11px;font-size:12px;color:var(--muted)}.hash{display:block;margin-top:7px;font-size:11px}.columns{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.gap{padding:15px 0;border-top:1px solid var(--line)}.gap:first-of-type{border-top:0;padding-top:0}.gap-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.gap p{font-size:13px;color:var(--muted)}.timeline{list-style:none;padding:0;margin:0}.timeline li{padding:0 0 19px 16px;border-left:2px solid var(--line);position:relative}.timeline li:before{content:"";position:absolute;left:-5px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--blue)}.timeline time{display:block;font-size:11px;color:var(--muted)}.timeline p{font-size:13px}.evidence{display:flex;gap:10px;flex-wrap:wrap}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}.evidence a{display:inline-block;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:6px 10px}.limits{font-size:13px;color:var(--muted)}footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:23px}.loading{padding:35px;color:var(--muted)}@media(max-width:850px){.hosts{grid-template-columns:1fr}.columns{grid-template-columns:1fr}.host .proof{grid-template-columns:62px 1fr}h1{font-size:28px}main{padding:23px 17px 45px}.panel{padding:18px}header{align-items:flex-start}.connect{max-width:160px;text-align:right}}@media(prefers-reduced-motion:no-preference){.dot{transition:background .2s}}
</style>
<main>
  <header><div class="brand">READER / 工作进度</div><div class="connect" id="connection"><span class="dot"></span>正在连接本地工作单…</div></header>
  <div id="content"><div class="panel loading">正在读取进度。此页面不执行构建或设备操作。</div></div>
  <footer><span>唯一数据源：共享阅读器工作单 · 每 3 秒读取</span><a href="/work-order" target="_blank" rel="noopener">查看完整工作单 ↗</a></footer>
</main>
<script>
const content=document.querySelector('#content'), connection=document.querySelector('#connection');
let lastData=null,lastKey='',lastSuccess=null;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};
const date=s=>new Date(s).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const badge=(text,kind='open')=>el('span',text,'badge '+kind);
function render(d){
 const fragment=document.createDocumentFragment(),hero=el('section',null,'hero');
 hero.append(badge(d.package+' · '+d.state),el('h1',d.title),el('p',d.outcome,'summary'),el('div','最近实质更新：'+date(d.updatedAt)+' · '+d.owner,'timestamp'));
 const notice=el('div',null,'notice');notice.id='stale';hero.append(notice);fragment.append(hero);
 const activity=el('section',null,'panel activity');activity.append(el('h2','当前在做什么'),el('div',d.activity.title,'activity-title'),el('p',d.activity.detail,'muted'));
 const meta=el('div',null,'meta');meta.append(el('span','目标：'+d.target),el('span','开始：'+date(d.activity.startedAt)),el('span','范围：'+d.scope));activity.append(meta,el('p','下一项实际动作：'+d.nextAction,'next'));fragment.append(activity);
 const hostPanel=el('section',null,'panel');hostPanel.append(el('h2','三个应用：证据到了哪一层'),el('p','构建和安装不能替代运行验收；每一项结论都有明确范围。','small muted'));
 const hosts=el('div',null,'hosts');hosts.style.marginTop='16px';
 for(const h of d.hosts){const card=el('article',null,'host'),heading=el('div',null,'host-title');heading.append(el('h3',h.name),badge(h.verdict,h.verdictKind));card.append(heading);const proof=el('div',null,'proof');const live=d.liveKitHeads[h.name],same=live===h.kit;
 for(const [label,value] of [['源码',same?'共同 Kit '+h.kit.slice(0,8):'当前源码与记录不一致'],['构建',h.build],['安装',h.install]])proof.append(el('span',label,'label'),el('span',value,!same&&label==='源码'?'bad':''));card.append(proof,el('div',h.runtime,'runtime'));
 const detail=el('details'),sum=el('summary','查看版本与未覆盖范围');detail.append(sum,el('p',h.remaining),el('p','工作目录：'+h.checkout));detail.append(el('code','HAP SHA-256 '+h.hap,'hash'),el('code','当前 Kit '+(live||'读取失败'),'hash'));card.append(detail);hosts.append(card)}hostPanel.append(hosts);fragment.append(hostPanel);
 const cols=el('div',null,'columns'),gaps=el('section',null,'panel');gaps.append(el('h2','有限收尾：仍未过关的边界'));
 for(const g of d.gaps){const item=el('article',null,'gap'),top=el('div',null,'gap-top');top.append(el('h3',g.title),badge(g.status,g.kind));item.append(top,el('p',g.detail),el('p','处理边界：'+g.action,'small'));gaps.append(item)}
 const milestones=el('section',null,'panel');milestones.append(el('h2','最近取得的实际产出'));const list=el('ol',null,'timeline');for(const m of d.milestones){const li=el('li');li.append(el('time',date(m.at)),el('p',m.text));list.append(li)}milestones.append(list);cols.append(gaps,milestones);fragment.append(cols);
 const evidence=el('section',null,'panel');evidence.append(el('h2','可查证的记录'));const links=el('div',null,'evidence');for(const e of d.evidence){const a=el('a',e.label);a.href='/evidence?id='+encodeURIComponent(e.id);a.target='_blank';a.rel='noopener';links.append(a)}evidence.append(links,el('p',d.evidenceNote,'small muted'));evidence.lastChild.style.marginTop='13px';fragment.append(evidence);
 const limits=el('section',null,'panel limits');limits.append(el('h2','这轮工作的停止边界'),el('p',d.stopRule),el('p',d.excluded),el('p',d.costNote));fragment.append(limits);content.replaceChildren(fragment);updateAge();
}
function updateAge(){if(!lastData)return;const age=Math.max(0,Math.round((Date.now()-Date.parse(lastData.updatedAt))/60000)),n=document.querySelector('#stale');if(n){n.style.display=age>=15?'block':'none';n.textContent='已 '+age+' 分钟没有实质进度更新。页面连接正常不代表任务仍在执行；以上是最后一次记录。'}}
async function refresh(){try{const r=await fetch('/api/progress',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!d.hosts||!d.gaps)throw Error('进度结构不完整');lastData=d;const copy={...d};delete copy.servedAt;const key=JSON.stringify(copy);if(key!==lastKey){lastKey=key;render(d)}lastSuccess=Date.now();connection.replaceChildren(el('span',null,'dot'),document.createTextNode('连接正常 · '+date(d.servedAt)+' 读取'));updateAge()}catch(error){connection.replaceChildren(el('span',null,'dot'),document.createTextNode('连接中断 · 保留最后记录'));connection.firstChild.style.background='var(--red)';if(!lastSuccess)content.replaceChildren(el('div','无法读取进度：'+error.message+'。请启动 scripts/serve-reader-progress.py。','panel'));}}
refresh();setInterval(refresh,3000);
</script>
</html>
