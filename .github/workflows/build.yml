name: Build OHOS

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-ohos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build_hap:
    name: Build unsigned HAP
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/honjow/harmonyos-build-env:26.0-api26
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Guard public build profile
        shell: bash
        run: |
          bash scripts/check-public-build-profile.sh --head

      - name: Check release version consistency
        shell: bash
        run: |
          node scripts/test_release_version_contract.mjs

      - name: Check settings backup contract
        shell: bash
        run: |
          node scripts/test_settings_backup_contract.mjs

      - name: Check persistence inventory contract
        shell: bash
        run: |
          node scripts/test_persistence_inventory_contract.mjs

      - name: Check locale key parity
        shell: bash
        run: |
          node scripts/test_locale_key_parity_contract.mjs

      - name: Reject tracked device run manifests
        shell: bash
        run: |
          python3 scripts/test_device_protocol_gate.py

      - name: Disable clipboard auto-detection for public self-sign builds
        shell: bash
        run: |
          python3 scripts/prepare_public_clipboard_build.py

      - name: Get app version
        shell: bash
        run: |
          version=$(node -e "const fs=require('fs'); const m=fs.readFileSync('AppScope/app.json5','utf8').match(/\"versionName\"\\s*:\\s*\"([^\"]+)\"/); if (!m) process.exit(1); console.log(m[1])")
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install OHPM dependencies
        shell: bash
        run: |
          ohpm install --all

      - name: Build unsigned HAP (debug)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon

      - name: Build unsigned HAP (release)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          hvigorw assembleHap --mode module -p product=default -p buildMode=release --no-daemon

      - name: Collect unsigned HAP
        shell: bash
        run: |
          src="entry/build/default/outputs/default/entry-default-unsigned.hap"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            dst="NextN_${APP_VERSION}_ohos-release-unsigned.hap"
          else
            dst="NextN_${APP_VERSION}_ohos-debug-unsigned.hap"
          fi
          test -f "$src"
          cp "$src" "$dst"
          echo "HAP_PATH=$dst" >> "$GITHUB_ENV"

      - name: Inspect unsigned HAP
        shell: bash
        run: |
          python3 scripts/verify_hap_native_libs.py "$HAP_PATH"
          python3 - <<'PY'
          import os
          import zipfile
          import json
          from pathlib import Path

          hap = Path(os.environ['HAP_PATH'])
          with zipfile.ZipFile(hap) as z:
              names = z.namelist()
              packaged_app = json.loads(z.read('module.json'))['app']
          expected_app = json.loads(Path('AppScope/app.json5').read_text())['app']
          for field in ('bundleName', 'versionName', 'versionCode'):
              if packaged_app[field] != expected_app[field]:
                  raise SystemExit(f'Packaged {field} does not match AppScope/app.json5')
          if packaged_app['versionName'] != os.environ['APP_VERSION']:
              raise SystemExit('Packaged version does not match artifact name')
          print(f'HAP: {hap}')
          print(f'Size MiB: {hap.stat().st_size / 1024 / 1024:.2f}')
          print(f'arm64 entries: {sum(1 for name in names if name.startswith("libs/arm64-v8a/"))}')
          print(f'x86_64 entries: {sum(1 for name in names if name.startswith("libs/x86_64/"))}')
          print(f'has sourceMaps.map: {"ets/sourceMaps.map" in names}')
          PY

      - name: Upload unsigned HAP
        uses: actions/upload-artifact@v4
        with:
          name: ohos-hap-unsigned
          path: ${{ env.HAP_PATH }}
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, 'stable') && !contains(github.ref, 'alpha') && !contains(github.ref, 'rc')
    name: Publish
    needs: build_hap
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get app version
        shell: bash
        run: |
          version=$(node -e "const fs=require('fs'); const m=fs.readFileSync('AppScope/app.json5','utf8').match(/\"versionName\"\\s*:\\s*\"([^\"]+)\"/); if (!m) process.exit(1); console.log(m[1])")
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Verify release notes
        shell: bash
        run: |
          notes="changelog/v${APP_VERSION}.md"
          test -s "$notes"
          test "$GITHUB_REF_NAME" = "v${APP_VERSION}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts

      - name: List artifacts
        shell: bash
        run: |
          ls -R /tmp/artifacts

      - name: Upload to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: /tmp/artifacts/ohos-hap-unsigned/*.hap
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref, 'pre') }}
          allowUpdates: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          bodyFile: changelog/v${{ env.APP_VERSION }}.md
